defaults:
    - override hydra/launcher: submitit_local

# environment
task: dog-run
obs: state
num_envs: 1

# evaluation
checkpoint: ???
eval_episodes: 10
eval_freq: 50000

# training
steps: 10_000_00
batch_size: 512
steps_per_update: 1
reward_coef: 0.5
value_coef: 0.1
consistency_coef: 2.0
rho: 0.5
lr: 5e-4 # 1e-3
enc_lr_scale: 1.0
grad_clip_norm: 10
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3 # 5
min_std: 0.05
max_std: 2.0
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 0
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 50
task_dim: 96
num_q: 2
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: tdmpc-new
wandb_entity: mikezhang95
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
save_video: false
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???

# speedups
compile: False
